# ::::::::::::::::::::::::::::::::::::::::::::::::::::::
# :: Kademlia Default Configuration
# ::::::::::::::::::::::::::::::::::::::::::::::::::::::

# ::::: GLOBAL ::::::

# Network size
SIZE 5000

# Kademlia k-bucket size
K 20

# Network latency (ms)
MINDELAY  100
MAXDELAY  100

# Simulation time (1 hour)
SIM_TIME 1000*60*60


# ::::: TIMING ::::::
BASELINE_STEP 1
TRAFFIC_STEP  (SIM_TIME)/SIZE
OBSERVER_STEP 100000
TURBULENCE_STEP  (SIM_TIME*20)/SIZE


# ::::: network :::::
random.seed 

simulation.experiments 1

simulation.endtime SIM_TIME

network.size SIZE


# ::::: LAYERS :::::
protocol.0link peersim.core.IdleProtocol

protocol.1uniftr peersim.transport.UniformRandomTransport
protocol.1uniftr.mindelay MINDELAY
protocol.1uniftr.maxdelay MAXDELAY

protocol.2unreltr peersim.transport.UnreliableTransport
protocol.2unreltr.drop 0
protocol.2unreltr.transport 1uniftr

protocol.3kademlia peersim.kademlia.KademliaProtocol
protocol.3kademlia.transport 2unreltr
#protocol.3kademlia.BITS 32


# ::::: INITIALIZERS :::::
init.0randlink peersim.dynamics.WireKOut
init.0randlink.k K
init.0randlink.protocol 0link

init.1uniqueNodeID peersim.kademlia.CustomDistribution
init.1uniqueNodeID.protocol 3kademlia
# ::::: SYBIL ATTACK PARAMETERS ::::::
# Number of Sybil nodes
init.1uniqueNodeID.sybil_count 50

# Target node ID for attack (the Sybils will position themselves close to this ID)
init.1uniqueNodeID.sybil_target 409281074974745890872116138270055241252539876

# Proximity bits: higher = more spread out, lower = tighter cluster
# Range: 1-160 (network : 160-bit IDs)
# 150 bits environ la proximité sans Sybil
init.1uniqueNodeID.proximity_bits 140


init.2statebuilder peersim.kademlia.StateBuilder
init.2statebuilder.protocol 3kademlia
init.2statebuilder.transport 2unreltr



# ::::: CONTROLS :::::

# baseline initializer - computes reference baseline at time=0
control.0baseline peersim.kademlia.BaselineInitializer
control.0baseline.protocol 3kademlia
control.0baseline.step BASELINE_STEP
control.0baseline.sample_size 500

# traffic generator
control.1traffic peersim.kademlia.TrafficGenerator
control.1traffic.protocol 3kademlia
control.1traffic.step TRAFFIC_STEP
control.1traffic.sybil_target 409281074974745890872116138270055241252539876
control.1traffic.detection_period 50

# turbolence
control.2turbolenceAdd peersim.kademlia.Turbulence
control.2turbolenceAdd.protocol 3kademlia
control.2turbolenceAdd.transport 2unreltr
control.2turbolenceAdd.step TURBULENCE_STEP
control.2turbolenceAdd.p_idle 1.0
control.2turbolenceAdd.p_rem 0.0
control.2turbolenceAdd.p_add 0.0

# observer
control.3 peersim.kademlia.KademliaObserver
control.3.protocol 3kademlia
control.3.step OBSERVER_STEP

